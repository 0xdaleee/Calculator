<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- todo add style -->
    <!-- todo add interactive -->

    <div class="numbers-container" id="numContainer">
      <p id="name">0xdaleee</p>
      <input type="text" id="display" readonly />

      <button
        id="num1"
        class="num-button num-active"
        onclick="appendValue('1')"
      >
        1
      </button>
      <button id="num2" class="num-button" onclick="appendValue('2')">2</button>
      <button id="num3" class="num-button" onclick="appendValue('3')">3</button>
      <button id="num4" class="num-button" onclick="appendValue('4')">4</button>
      <button id="num5" class="num-button" onclick="appendValue('5')">5</button>
      <button id="num6" class="num-button" onclick="appendValue('6')">6</button>
      <button id="num7" class="num-button" onclick="appendValue('7')">7</button>
      <button id="num8" class="num-button" onclick="appendValue('8')">8</button>
      <button id="num9" class="num-button" onclick="appendValue('9')">9</button>
      <button id="num0" class="num-button" onclick="appendValue('0')">0</button>

      <button
        id="divide"
        class="op-button op-active"
        onclick="appendValue('/')"
      >
        ÷
      </button>
      <button id="multiply" class="op-button" onclick="appendValue('*')">
        x
      </button>
      <button id="minus" class="op-button" onclick="appendValue('-')">-</button>
      <button id="plus" class="op-button" onclick="appendValue('+')">+</button>
      <a href="subscriptionPlan.html">
        <button id="equals" class="op-button">=</button>
      </a>

      <button id="dot" class="op-button">.</button>
      <button id="clear" class="op-button" onclick="clearDisplay()">AC</button>
      <button id="backspace" class="op-button" onclick="deleteLast()">
        BCKSPCE
      </button>
    </div>
    <script src="index.js"></script>
  </body>
</html>
